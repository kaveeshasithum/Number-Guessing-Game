<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">

        <div class="game-card shadow-lg">

            <div class="text-center mb-4">

                <div class="game-icon mb-3">
                    <i class="fa-solid fa-gamepad"></i>
                </div>

                <h1 class="fw-bold">Number Guessing Game</h1>

                <p class="text-secondary">
                    Guess the hidden number between 1 and 10
                </p>

            </div>

            <div class="game-input p-4 rounded-4 text-center mb-4">

                <h5 class="fw-bold mb-3">Enter Your Guess</h5>
                <input
                    type="number"
                    id="guessNumber"
                    class="form-control form-control-lg text-center mb-3"
                    placeholder="Enter number 1 - 10"
                    min="1"
                    max="10"
                >
                <button
                    class="btn btn-primary btn-lg w-100"
                    onclick="checkGuess()">
                    <i class="fa-solid fa-magnifying-glass me-2"></i>
                    Check Number
                </button>
            </div>

            <div class="text-center mb-4">
                <span class="badge bg-primary fs-6 p-3">
                    <i class="fa-solid fa-heart me-2"></i>
                    3 Chances Per Round
                </span>
            </div>

            <div>
                <h4 class="fw-bold mb-3">
                    <i class="fa-solid fa-clock-rotate-left text-primary me-2"></i>
                    Guess History
                </h4>
                <div class="table-responsive">
                    <table class="table table-hover text-center align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>No</th>

                                <th>User Guess</th>

                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody id="history">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="app.js"></script>
